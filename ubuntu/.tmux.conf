set -g @layout_pc 'd9d8,76x43,0,0[76x21,0,0{38x21,0,0,0,37x21,39,0,3},76x21,0,22{38x21,0,22,1,37x21,39,22[37x10,39,22,2,37x10,39,33,4]}]'



# tmuxを256色表示できるようにする
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# prefixキーをC-fに変更
set -g prefix C-f

# C-bのキーバインドを解除
unbind C-b

# ステータスバーをトップに配置する
set-option -g status-position top

# 左右のステータスバーの長さを決定する 
set-option -g status-left-length 90
set-option -g status-right-length 90

# #P => ペイン番号
# 最左に表示
set-option -g status-left '#H:[#P]'

# Wi-Fi、バッテリー残量、現在時刻
# 最右に表示
set-option -g status-right '#(wifi) #(battery --tmux) [%Y-%m-%d(%a) %H:%M]'

# ステータスバーを1秒毎に描画し直す
set-option -g status-interval 1

# センタライズ（主にウィンドウ番号など）
set-option -g status-justify centre

# ステータスバーの色を設定する
set-option -g status-bg "colour238"

# status line の文字色を指定する。
set-option -g status-fg "colour255"

# vimのキーバインドでペインを移動する
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

# vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# swap
bind -r Left  run-shell "tmux swap-pane -s ! -t '{left-of}'"
bind -r Right run-shell "tmux swap-pane -s ! -t '{right-of}'"
bind -r Up    run-shell "tmux swap-pane -s ! -t '{up-of}'"
bind -r Down  run-shell "tmux swap-pane -s ! -t '{down-of}'"

# | でペインを縦分割する
bind | split-window -h

# - でペインを縦分割する
bind - split-window -v

# 番号基準値を変更
set-option -g base-index 1

# マウス操作を有効にする
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
# 最後までスクロールダウンするとコピーモードを抜ける
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

# コピーモードを設定する
# コピーモードでvimキーバインドを使う
setw -g mode-keys vi

# 'v' で選択を始める
bind -T copy-mode-vi v send -X begin-selection

# 'V' で行選択
bind -T copy-mode-vi V send -X select-line

# 'C-v' で矩形選択
bind -T copy-mode-vi C-v send -X rectangle-toggle

# 'y' でヤンク
bind -T copy-mode-vi y send -X copy-selection

# 'Y' で行ヤンク
bind -T copy-mode-vi Y send -X copy-line

# 'C-p'でペースト
# bind-key C-p paste-buffer

# nvim copy mode
bind-key C-n display-popup -E "tmux capture-pane -pS -32768 | nvim -"

# popup
bind-key C-p display-popup -E "fish"

# コピーした際にWindowsのクリップボードにも転送する (yum install -y xsel)
# bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"

if-shell "uname -a | grep Microsoft" '\
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"; \
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"; \
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"\
'

# go full screen when focused on nvim
set -g focus-events on
# set-hook -g pane-focus-in 'run-shell -b "zoom=\$(tmux display-message -p \"#{window_zoomed_flag}\"); [ \"\$zoom\" = 0 ] || exit 0; tty=\$(tmux display-message -p \"#{pane_tty}\"); cmd=\$(ps -o comm= -t \${tty#/dev/} 2>/dev/null | tail -n 1); case \"\$cmd\" in nvim|vim) tmux resize-pane -Z ;; esac"'
set-hook -g pane-focus-in 'run-shell -b "zoom=\$(tmux display-message -p \"#{window_zoomed_flag}\"); [ \"\$zoom\" = 0 ] || exit 0; no=\$(tmux show-option -pqv @no_auto_zoom); [ -z \"\$no\" ] || exit 0; tty=\$(tmux display-message -p \"#{pane_tty}\"); cmd=\$(ps -o comm= -t \${tty#/dev/} 2>/dev/null | tail -n 1); case \"\$cmd\" in nvim|vim) tmux resize-pane -Z ;; esac"'






# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-urlview'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
